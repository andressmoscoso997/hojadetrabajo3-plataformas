apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.serviceName }}
  description: "Microservicio Python ${{ values.serviceName }} — generado via Backstage Golden Path"
  annotations:
    github.com/project-slug: ${{ values.repoOwner }}/${{ values.serviceName }}
  tags:
    - python
    - fastapi
    - microservicio
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: plataforma-uniandes